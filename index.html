<style>
:root, :root[data-theme="dark"] {
  --bg:#0f1216; --card:#181d23; --card2:#212830; --line:#2b333d; --text:#eef1f4; --muted:#8e99a6;
  --acc:#ff7a1a; --acc-ink:#1a0d00; --acc-soft:rgba(255,122,26,.14); --ok:#35c98a; --ok-soft:rgba(53,201,138,.16);
  --bad:#ff6161; --warm:#5aa9ff; --radius:14px;
  --m-sil:#232a32; --m-off:#3a434e; --m-sec:#a8622f;
}
:root[data-theme="light"] {
  --bg:#f2f3f5; --card:#ffffff; --card2:#eceef1; --line:#d9dde3; --text:#13171c; --muted:#5d6876;
  --acc:#e5620a; --acc-ink:#fff; --acc-soft:rgba(229,98,10,.12); --ok:#13915c; --ok-soft:rgba(19,145,92,.13);
  --bad:#d13a3a; --warm:#2a74d0;
  --m-sil:#e6e9ed; --m-off:#c9cfd6; --m-sec:#f6b98a;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--text); }
body { font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px); max-width:720px; margin:0 auto; }
body.hastimer { padding-bottom:calc(env(safe-area-inset-bottom) + 260px); } /* plass til hvile-/intervalltimeren over fanene */
h1 { font-size:26px; margin:6px 0 14px; letter-spacing:-.02em; }
h2 { font-size:18px; margin:22px 0 10px; }
h3 { font-size:16px; margin:0 0 6px; }
.muted { color:var(--muted); } .small { font-size:13px; } .tiny { font-size:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.row { display:flex; align-items:center; gap:10px; } .row.wrap { flex-wrap:wrap; } .grow { flex:1; min-width:0; }
.between { justify-content:space-between; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
.btn { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-weight:600; min-height:44px; }
.btn.acc { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
.btn.big { width:100%; font-size:18px; padding:15px; }
.btn.ghost { background:none; }
.btn.danger { color:var(--bad); }
.btn.danger.fill { background:var(--bad); border-color:var(--bad); color:#fff; }
#dlgIn { font-size:18px; }
.btn.sm { min-height:36px; padding:6px 10px; font-size:14px; }
.iconbtn { width:40px; height:40px; border-radius:10px; display:inline-grid; place-items:center; font-size:20px; color:var(--muted); }
.chip { display:inline-block; padding:8px 12px; border-radius:999px; background:var(--card2); border:1px solid var(--line); font-size:14px; font-weight:600; }
.chip.on { background:var(--acc-soft); border-color:var(--acc); color:var(--acc); }
.badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 7px; border-radius:6px; background:var(--acc-soft); color:var(--acc); }
input, select, textarea { font:inherit; font-size:16px; color:var(--text); background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; min-height:44px; }
textarea { min-height:70px; resize:vertical; }
input:focus, select:focus, textarea:focus { outline:2px solid var(--acc); outline-offset:-1px; }
label.f { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
.list > * + * { border-top:1px solid var(--line); }
.li { display:flex; align-items:center; gap:10px; padding:12px 2px; width:100%; text-align:left; }
.note { font-size:14px; padding:8px 10px; border-radius:10px; background:var(--card2); margin:8px 0 10px; }
.note.up { background:var(--ok-soft); color:var(--ok); } .note.down { background:rgba(255,97,97,.12); color:var(--bad); }

/* Øktskjerm */
.wohead { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 6px) 0 8px; margin-top:calc(-8px - env(safe-area-inset-top)); }
.setgrid { display:grid; grid-template-columns:40px 1fr 1fr 54px; gap:8px; align-items:center; }
.sethead { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.sethead > :nth-child(2), .sethead > :nth-child(3) { text-align:center; }
.setrow { margin-top:6px; }
.setrow .in { text-align:center; font-size:20px; font-weight:600; min-height:50px; padding:6px; }
.setno { height:50px; border-radius:10px; font-weight:700; color:var(--muted); background:var(--card2); }
.setrow.warm .setno { color:var(--warm); }
.wohead .grow { min-width:0; } .wohead h1 { font-size:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* Puls */
:root { --z1:#5b8def; --z2:#2fa865; --z3:#d9a521; --z4:#e5702a; --z5:#d63b3b; }
.hrpill { display:inline-flex; align-items:center; gap:4px; height:36px; padding:0 10px; border-radius:18px; background:var(--card2); border:1px solid var(--line); font-size:14px; color:var(--muted); white-space:nowrap; }
.hrpill.on { color:var(--text); border-color:var(--bad); } .hrpill.on .ico { color:var(--bad); }
.hrpill .zone { min-width:0; padding:1px 5px; font-size:11px; }
.hrst { font-weight:700; } .hrst.ok { color:var(--ok); } .hrst.low { color:var(--warm); } .hrst.high { color:var(--bad); }
#iH .ico { color:var(--bad); }
/* Felles UI */
.ico { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; flex:none; }
.ico circle[r="1.3"] { fill:currentColor; }
.btn .ico { margin-right:4px; vertical-align:-4px; }
.pagehead { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin:6px 0 14px; }
.pagehead h1 { margin:0; }
.cap { text-transform:capitalize; }
.sec-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:22px 4px 8px; }
.hscroll { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:2px 16px; -webkit-overflow-scrolling:touch; }
.hscroll::-webkit-scrollbar { display:none; } .hscroll > * { flex:none; }
.card .hscroll { margin:0 -14px; padding:2px 14px; }
.btn, .chip, .li, .iconbtn, .chk, .setno, .pesum { transition:transform .08s, opacity .08s; }
.btn:active, .chip:active, .iconbtn:active, .chk:active { transform:scale(.96); }
.li:active, .pesum:active { opacity:.6; }
.chev { color:var(--muted); font-size:20px; line-height:1; }
.card.li { display:flex; width:100%; }
.card.list { padding:2px 14px; }
.dayname { margin:2px 0 10px; font-size:22px; }
.exlist { border-top:1px solid var(--line); }
.exrow { display:flex; align-items:baseline; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
.exrow .sslabel { width:20px; flex:none; }
.exrow .exw { font-weight:700; white-space:nowrap; } .exrow .up { color:var(--ok); } .exrow .down { color:var(--bad); }
.exrow .muted { font-size:13px; white-space:nowrap; }
.empty-card { text-align:center; }
.switch { width:48px; height:28px; border-radius:14px; background:var(--card2); border:1px solid var(--line); position:relative; flex:none; }
.switch i { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:transform .15s, background .15s; }
.switch.on { background:var(--acc); border-color:var(--acc); } .switch.on i { transform:translateX(20px); background:#fff; }
.card.prog { display:flex; align-items:center; gap:8px; padding:12px 8px 12px 14px; }
.card.prog > button.grow { text-align:left; min-width:0; }
.card.prog .muted { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.iconbtn.danger { color:var(--bad); }
.dayin { font-weight:700; font-size:17px; background:transparent; border-color:transparent; padding-left:2px; }
.dayin:focus { background:var(--card2); }
.perow { border-top:1px solid var(--line); }
.pesum { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:10px 2px; }
.pesum .grow { display:flex; flex-direction:column; min-width:0; }
.pesum .sslabel { width:20px; flex:none; }
.perow.open { background:var(--card2); margin:0 -14px; padding:0 14px 12px; border-radius:10px; }
.pebody .pe-grid input, .pebody .pe-grid select, .pebody input { background:var(--card); }
.addbtn { margin-top:8px; color:var(--acc); border:0; padding-left:2px; }
.lic { width:34px; height:34px; border-radius:9px; background:var(--card2); display:inline-grid; place-items:center; color:var(--acc); flex:none; }
.setrow2 { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; }
.setrow2 + .setrow2 { border-top:1px solid var(--line); }
.setrow2 select { width:auto; min-width:130px; }
.search { position:relative; } .search .ico { position:absolute; left:12px; top:13px; color:var(--muted); } .search input { padding-left:38px; }
nav.tabs .ic { position:relative; display:inline-block; }
nav.tabs .dot { position:absolute; top:-2px; right:-6px; width:8px; height:8px; border-radius:50%; background:var(--ok); }
details summary { cursor:pointer; }
svg.body { width:100%; max-width:440px; display:block; margin:0 auto; }
svg.body .sil { fill:var(--m-sil); } svg.body .mm { fill:var(--m-off); stroke:var(--card); stroke-width:.8; }
svg.body .mm.h1 { fill:color-mix(in srgb, var(--acc) 35%, var(--m-off)); } svg.body .mm.h2 { fill:color-mix(in srgb, var(--acc) 60%, var(--m-off)); }
svg.body .mm.h3 { fill:color-mix(in srgb, var(--acc) 82%, var(--m-off)); } svg.body .mm.h4 { fill:var(--acc); }
svg.body [data-act] { cursor:pointer; }
.heatlegend { display:flex; align-items:center; justify-content:center; gap:5px; font-size:12px; color:var(--muted); margin-top:6px; flex-wrap:wrap; }
.heatlegend i { width:14px; height:10px; border-radius:3px; background:var(--acc); margin-left:6px; }
.heatlegend .l0 { background:var(--m-off); } .heatlegend .l1 { background:color-mix(in srgb, var(--acc) 35%, var(--m-off)); } .heatlegend .l2 { background:color-mix(in srgb, var(--acc) 60%, var(--m-off)); } .heatlegend .l3 { background:color-mix(in srgb, var(--acc) 82%, var(--m-off)); }
svg.body .mm.p { fill:var(--acc); } svg.body .mm.s { fill:var(--m-sec); } svg.body text { fill:var(--muted); font-size:12px; }
.mchip { display:inline-block; font-size:13px; font-weight:600; padding:4px 10px; border-radius:8px; margin:0 6px 6px 0; }
.mchip.p { background:var(--acc); color:var(--acc-ink); } .mchip.s { background:var(--acc-soft); color:var(--acc); }
.how { padding-left:20px; margin:6px 0 12px; } .how li { margin-bottom:6px; }
.card.ss { border-left:4px solid var(--warm); }
.sslabel { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--warm); }
.cue { font-size:14px; color:var(--muted); font-style:italic; margin-top:6px; }
.cue.clamp { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
.cue.clamp::after { content:' … mer'; }
.cardio-in { display:grid; grid-template-columns:1fr 1fr 54px; gap:8px; align-items:end; margin-top:6px; }
.cardio-in label { font-size:11px; color:var(--muted); display:block; margin-bottom:2px; text-transform:uppercase; letter-spacing:.05em; }
.cardio-in .in { text-align:center; font-size:20px; font-weight:600; min-height:50px; padding:6px; }
.cardio-in.done .chk { background:var(--ok); border-color:var(--ok); color:#fff; } .cardio-in.done .in { background:var(--ok-soft); border-color:transparent; }
.pblock { padding:6px 0 2px; border-top:1px dashed var(--line); }
.pblock.rep { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; margin:6px 0; }
.segrow { display:grid; grid-template-columns:1fr 56px 74px 36px; gap:6px; align-items:center; margin:4px 0; }
.segrow input, .segrow select { min-height:40px; padding:6px 8px; } .segrow input[inputmode] { text-align:center; }
.pebody .pblock.rep input, .pebody .pblock.rep select { background:var(--card2); }
/* Fokusmodus for intervalltimer */
#focus { position:fixed; inset:0; z-index:28; background:var(--bg); display:none; flex-direction:column; padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px); text-align:center; }
#focus .ft { font-size:96px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; margin:18px 0 8px; }
#focus .fp { font-size:30px; font-weight:800; }
#focus .fz { font-size:18px; margin-top:6px; } #focus .fz .zone { font-size:16px; padding:3px 10px; }
#focus .fh { font-size:22px; margin-top:14px; min-height:28px; }
#focus .fx { color:var(--muted); font-size:16px; margin-top:auto; }
#focus .bar { height:8px; background:var(--card2); border-radius:4px; overflow:hidden; margin:14px 0; } #focus .bar i { display:block; height:100%; background:var(--acc); }
#focus .btn { font-size:17px; min-height:52px; }
.zrow { display:grid; grid-template-columns:62px 72px 1fr; gap:8px; align-items:start; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
.zrow .zone { min-width:0; }
.plan { font-size:14px; margin:8px 0; } .plan div { display:flex; justify-content:space-between; gap:8px; padding:3px 0; border-bottom:1px dashed var(--line); }
.zone { display:inline-block; min-width:52px; text-align:center; font-size:12px; font-weight:700; border-radius:6px; padding:1px 6px; color:#fff; }
.z1 { background:#5b8def; } .z2 { background:#2fa865; } .z3 { background:#d9a521; } .z4 { background:#e5702a; } .z5 { background:#d63b3b; }
#timer .ivphase { font-size:20px; font-weight:800; }
.chk { height:50px; border-radius:12px; border:2px solid var(--line); font-size:22px; color:var(--muted); }
.setrow.done .chk { background:var(--ok); border-color:var(--ok); color:#fff; }
.setrow.done .in { background:var(--ok-soft); border-color:transparent; }
.plates { grid-column:2 / 4; font-size:12px; color:var(--muted); text-align:center; min-height:0; }
.plates:empty { display:none; }

/* Hviletimer */
#timer { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 66px); z-index:20; display:none; padding:0 12px; }
#timer .inner { max-width:696px; margin:0 auto; background:var(--card); border:1px solid var(--acc); border-radius:16px; padding:10px 12px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
#timer .t { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; min-width:92px; }
#timer .bar { height:5px; background:var(--card2); border-radius:3px; overflow:hidden; margin-top:8px; }
#timer .bar i { display:block; height:100%; background:var(--acc); }
#timer.ready .inner { border-color:var(--ok); } #timer.ready .t { color:var(--ok); }

/* Faner */
nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--card); border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px); display:flex; justify-content:center; }
nav.tabs .in { display:flex; width:100%; max-width:720px; }
nav.tabs button { flex:1; padding:6px 2px; font-size:12px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
nav.tabs button .ic { line-height:1; height:24px; }
nav.tabs button.on { color:var(--acc); }

/* Ark (bunnark) */
#sheet { position:fixed; inset:0; z-index:30; display:none; }
#sheet .bd { position:absolute; inset:0; background:rgba(0,0,0,.55); }
#sheet .pane { position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow:auto; background:var(--card); border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 18px); max-width:720px; margin:0 auto; }
#sheet .grabzone { position:sticky; top:-16px; z-index:2; background:var(--card); margin:-16px -16px 6px; padding:10px 16px 8px; touch-action:none; }
#sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--muted); opacity:.6; margin:0 auto; }
#sheet .sheetx { position:absolute; right:8px; top:4px; width:40px; height:36px; font-size:26px; line-height:1; color:var(--muted); }
#sheet .pane { overscroll-behavior:contain; }
body.noscroll { overflow:hidden; }

/* Diverse */
.weekdots { display:flex; gap:6px; } .weekdots span { flex:1; text-align:center; font-size:12px; color:var(--muted); }
.weekdots i { display:block; height:30px; border-radius:8px; background:var(--card2); margin-bottom:4px; }
.weekdots i.on { background:var(--acc); } .weekdots i.today { outline:2px solid var(--acc); outline-offset:-2px; }
.mbar { display:grid; grid-template-columns:128px 1fr 34px; gap:8px; align-items:center; font-size:14px; margin:6px 0; }
.mbar .tr { height:10px; background:var(--card2); border-radius:5px; overflow:hidden; position:relative; }
.mbar .tr i { display:block; height:100%; background:var(--acc); border-radius:5px; }
.stat { flex:1; background:var(--card2); border-radius:12px; padding:10px; }
.stat b { display:block; font-size:22px; }
.platevis { display:flex; align-items:center; justify-content:center; gap:3px; min-height:120px; margin:12px 0; }
.platevis .bar { width:46px; height:12px; background:#9aa3ad; border-radius:3px; }
.platevis .p { width:16px; border-radius:4px; border:1px solid rgba(0,0,0,.25); }
.pe-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; }
.pe-grid label { font-size:11px; color:var(--muted); display:block; margin-bottom:2px; }
.pe-grid input, .pe-grid select { min-height:40px; padding:6px; text-align:center; }
.pick[hidden] { display:none; }
svg.chart text { fill:var(--muted); font-size:11px; }
.empty { text-align:center; padding:28px 10px; color:var(--muted); }
/* Nederst, over fanelinja og en eventuell timer, så den ikke dekker overskriften */
.flash { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 78px + var(--timer-h, 0px)); left:50%; transform:translateX(-50%); z-index:40; background:var(--text); color:var(--bg);
  padding:10px 16px; border-radius:12px; font-weight:600; font-size:14px; max-width:90%; }
</style>

<script>
// Nødskjerm hvis appen ikke starter (f.eks. en gammel fil i cachen etter oppdatering).
// Vanlig skript, ikke modul, så den virker selv om modulen feiler. Knappen tømmer cache og laster på nytt.
(function () {
  var shown = false;
  function show(msg) {
    if (shown || document.getElementById('app').children.length) return; shown = true;
    document.getElementById('app').innerHTML = '<div style="padding:40px 20px;text-align:center;font-family:sans-serif"><h2>Appen fikk ikke startet</h2>' +
      '<p style="color:#8e99a6">' + (msg ? String(msg).replace(/[<>&]/g, '') : 'Prøv å laste på nytt.') + '</p>' +
      '<button id="ggFix" style="font:inherit;font-size:18px;padding:14px 22px;border-radius:12px;border:0;background:#ff7a1a;color:#1a0d00;font-weight:700">Rydd opp og last på nytt</button>' +
      '<p style="color:#8e99a6;font-size:13px;margin-top:16px">Treningsdataene dine ligger trygt lagret på telefonen og røres ikke.</p></div>';
    document.getElementById('ggFix').onclick = async function () {
      try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
      try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
      location.reload();
    };
  }
  window.addEventListener('error', function (e) { if (!document.getElementById('app').children.length) show(e.message); });
  setTimeout(function () { show(''); }, 4000);
})();
</script>

// Engangsoppdatering da Abilica PR 550 kom: nye kabeløvelser inn i malene som allerede ligger i profilen
function migratePR550(p) {
  const prog = name => p.programs.find(x => x.name === name), dayOf = (pr, n) => pr?.days.find(d => d.name === n);
  const swap = (d, from, to, extra = {}) => { const x = d?.ex.find(y => y.exId === from); if (x) Object.assign(x, { exId: to, inc: null, note: '' }, extra); };
  const add = (d, after, x) => { if (!d || d.ex.some(y => y.exId === x.exId)) return; const i = d.ex.findIndex(y => y.exId === after); d.ex.splice(i < 0 ? d.ex.length : i + 1, 0, x); };
  const ou = prog('Overkropp/underkropp – 4 dager');
  add(dayOf(ou, 'Overkropp 1 (tung)'), 'pulldown', pe('cable_fly_hl', 3, 12, 15, 'double', 60));
  swap(dayOf(ou, 'Overkropp 2 (volum)'), 'hammer', 'cable_preacher');
  swap(dayOf(ou, 'Underkropp 2 (volum)'), 'deadlift', 'rackpull');
  const bs = prog('Bein & sete + overkropp – 3 dager');
  add(dayOf(bs, 'Bein & sete 1'), 'rev_hyper', pe('cable_kickback', 3, 12, 15, 'double', 60));
  add(dayOf(bs, 'Bein & sete 1'), 'cable_kickback', pe('cable_abduct', 3, 15, 20, 'double', 60));
  swap(dayOf(bs, 'Bein & sete 2'), 'back_ext', 'pull_through');
  const kg = prog('Kom i gang – helkropp A/B');
  swap(dayOf(kg, 'Kom i gang A'), 'plank', 'pallof', { min: 8, max: 12, rule: 'double', note: 'Reps per side. Press rett fram og hold 2 sek uten å la kabelen vri deg.' });
  swap(dayOf(kg, 'Kom i gang B'), 'lat_raise', 'cable_lat_raise', { note: 'Trinsen helt nede og lett vekt. Reps per arm, løft til skulderhøyde.' });
  // Landmine-øvelser byttes ut i alle program, siden landmine-røret fulgte det gamle racket
  for (const pr of p.programs) for (const d of pr.days) { swap(d, 'tbar_row', 'cable_row_1arm'); swap(d, 'landmine_press', 'db_ohp'); }
}
function load() {

  if (db && validateDb(db)) db = null; // ødelagt lagring: start på nytt i stedet for å krasje ved oppstart
  if (!db || !db.profiles) {
    const p = newProfile('Meg');
    db = { v: 1, settings: { impl: clone(DEFAULT_IMPL), plates: { ...DEFAULT_PLATES }, bench: true, rest: 120, sound: true, theme: 'dark', customEx: [] }, profiles: { [p.id]: p }, current: p.id };
  }
  // Fyll inn nye standardfelt hvis appen er oppdatert
  for (const k in DEFAULT_IMPL) if (!db.settings.impl[k]) db.settings.impl[k] = clone(DEFAULT_IMPL[k]);
  if (db.settings.impl.barbell.name === 'Olympisk stang (20 kg)') db.settings.impl.barbell.name = 'Olympisk stang';
  for (const e of db.settings.customEx || []) { e.prim = (e.prim || []).map(m => OLD_MUS[m] || m); e.sec = (e.sec || []).map(m => OLD_MUS[m] || m); }
  if (db.settings.landmine === undefined) db.settings.landmine = false; // landmine-røret fulgte det gamle racket
  if (db.settings.impl.cable.name === 'Nedtrekk / roing') db.settings.impl.cable.name = 'Nedtrekksapparat (90 kg)';
  for (const p of Object.values(db.profiles)) { if (!p.mig?.pr550) { migratePR550(p); (p.mig = p.mig || {}).pr550 = true; } }
  // Versjonerte migreringer av lagringsformatet, kjøres i rekkefølge
  const MIG = {
    // v2: programoppsett ble lagret i hver fullført økt, og puls hvert 5. sekund. Krymper gamle økter.
    2: () => { for (const p of Object.values(db.profiles)) for (const w of p.workouts) {
      for (const e of w.exercises) delete e.pe;
      if (w.hr?.samples?.length > 2) { const out = []; for (const s of w.hr.samples) if (!out.length || s[0] - out[out.length - 1][0] >= HR_STEP) out.push(s); w.hr.samples = out; }
    } },
  };
  for (const v of Object.keys(MIG).map(Number).sort((a, b) => a - b)) if ((db.v || 1) < v) { MIG[v](); db.v = v; }
  if (!db.profiles[db.current]) db.current = Object.keys(db.profiles)[0];
  if (!db.settings.plates) db.settings.plates = { ...DEFAULT_PLATES };
  for (const p of Object.values(db.profiles)) {
    if (!Array.isArray(p.bw)) p.bw = [];
    if (!p.progState) p.progState = {};
    if (!p.active || typeof p.active !== 'object' || !Array.isArray(p.active.exercises)) p.active = null;
    if (!p.activeIds) { p.activeIds = p.activeProgramId ? [p.activeProgramId] : []; delete p.activeProgramId; }
    p.activeIds = p.activeIds.filter(id => p.programs.some(x => x.id === id));
    // Oppdater Langtur i allerede lagt til kondisjonsprogram med sonevalg
    for (const pr of p.programs) for (const d of pr.days) for (const x of d.ex) for (const s of x.plan || []) {
      if (s.t === 'Langtur' && !s.alt) { s.alt = ['2', '3']; x.note = LANGTUR_NOTE; if (d.name === 'Langtur (sone 2)') d.name = 'Langtur (sone 2–3)'; }
    }
  }
}

function tone(freqs, gap = 0.25, len = 0.18) {
  if (!db.settings.sound || !audioCtx) return;
  freqs.forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
    const s = audioCtx.currentTime + i * gap; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.5, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + len);
    o.start(s); o.stop(s + len + 0.02);
  });
}

const T = id => document.getElementById(id);
function ivState(a) {
  const iv = a.iv, plan = a.exercises[iv.ei]?.pe.plan || [];
  const el = ((iv.pausedAt || Date.now()) - iv.start - iv.pausedMs) / 1000;
  let acc = 0;
  for (let i = 0; i < plan.length; i++) { if (el < acc + plan[i].s) return { plan, i, left: acc + plan[i].s - el, el }; acc += plan[i].s; }
  return { plan, i: plan.length, left: 0, el, done: true };
}

  const elT = $('#elapsed'); if (elT && a) elT.textContent = fmtDur((Date.now() - a.start) / 1000);
  if (a?.iv) return tickInterval(el, a);
  if (!a || !a.restEnd) { if (Date.now() >= readyUntil) setTimerMode(el, '', ''); return; }
  const left = (a.restEnd - Date.now()) / 1000;
  if (left <= 0) {

    a.restEnd = null; save(); readyUntil = Date.now() + 4000;

    <button class="btn sm" data-act="timerAdd" data-s="-15">−15</button><button class="btn sm" data-act="timerAdd" data-s="15">+15</button>
    <button class="btn sm acc" data-act="timerStop">Hopp over</button></div><div class="bar"><i id="tB"></i></div></div>`);
  T('tT').textContent = fmtDur(left);

}
function tickInterval(el, a) {

    fo.style.display = 'flex';
  } else if (!state.focus && fo.style.display !== 'none') fo.style.display = 'none';
  const set = (id, fid, v, html) => { const a = T(id), b = state.focus ? T(fid) : null; for (const el of [a, b]) if (el) { if (html) el.innerHTML = v; else el.textContent = v; } };

/* ---------- Pulsmåler over Bluetooth (f.eks. Garmin med «Kringkast puls») ---------- */
// Virker i Chrome på Android. Safari på iPhone har ikke Web Bluetooth.
const HR = { dev: null, bpm: null, at: 0, status: 'av', name: '', tries: 0, manualOff: false };
const hrSupported = () => !!navigator.bluetooth;
const hrLive = () => HR.status === 'på' && HR.bpm && Date.now() - HR.at < 8000;
function hrPill() {
  if (!hrSupported()) return '';
  const z = hrLive() ? hrZone(HR.bpm) : 0;
  const inner = hrLive() ? `${icon('heart', 16)} <b>${HR.bpm}</b>${z ? ` <span class="zone z${z}">S${z}</span>` : ''}`
    : HR.status === 'kobler' ? `${icon('heart', 16)} Kobler …` : `${icon('heart', 16)} Puls`;
  return `<button class="hrpill ${hrLive() ? 'on' : ''}" data-act="hrMenu">${inner}</button>`;
}
// Sammenligner pulsen nå med sonen i fasen (z kan være «2» eller «1-2»)
function hrVsZone(z) {
  if (!hrLive()) return '';
  const max = hrMax();
  if (!max) return `${icon('heart', 16)} <b>${HR.bpm}</b> slag/min · <span class="muted">sett makspuls eller fødselsår under Mer for å se sonen</span>`;
  const [a, b] = String(z).split('-').map(Number), lo = max * ZONES[a][0] / 100, hi = max * ZONES[b || a][1] / 100;
  const st = HR.bpm < lo ? ['low', 'Øk farten'] : HR.bpm > hi ? ['high', 'Ro ned'] : ['ok', 'I sonen ✓'];
  return `${icon('heart', 16)} <b>${HR.bpm}</b> slag/min · <span class="hrst ${st[0]}">${st[1]}</span>`;
}
function hrUi() { document.querySelectorAll('.hrslot').forEach(el => el.innerHTML = hrPill()); }
function hrSample() {
  const a = prof()?.active; if (!a || !HR.bpm) return;
  const t = Math.round((Date.now() - a.start) / 1000), hs = a.hrs || (a.hrs = []), last = hs[hs.length - 1];
  if (!last || t - last[0] >= HR_STEP) { hs.push([t, HR.bpm]); save(); }
}
async function hrConnect() {
  if (!hrSupported()) { ACT.hrMenu(); return; }
  HR.manualOff = false;
  try {
    let dev = HR.dev;
    // requestDevice må kalles direkte fra trykket, før noe await
    const picking = dev ? null : navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    HR.status = 'kobler'; hrUi();
    if (picking) {
      dev = await picking;
      dev.addEventListener('gattserverdisconnected', hrLost);
      HR.dev = dev; HR.name = dev.name || 'Pulsmåler';
    }
    const srv = await dev.gatt.connect();
    const ch = await (await srv.getPrimaryService('heart_rate')).getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value, flags = v.getUint8(0);
      HR.bpm = flags & 1 ? v.getUint16(1, true) : v.getUint8(1); HR.at = Date.now();
      hrSample(); hrUi();
    });
    await ch.startNotifications();
    HR.status = 'på'; HR.tries = 0; hrUi(); flash('Koblet til ' + HR.name);
  } catch (e) {
    HR.status = 'av'; hrUi();

}

/* ---------- Import av Garmin-økt (TCX fra connect.garmin.com) ---------- */
function parseTcx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Filen er ikke en gyldig TCX-fil');
  const act = doc.getElementsByTagName('Activity')[0];
  if (!act) throw new Error('Fant ingen aktivitet i filen');
  const txt = (el, tag) => el.getElementsByTagName(tag)[0]?.textContent;
  const idTxt = txt(act, 'Id'), start = Date.parse(idTxt);
  if (isNaN(start)) throw new Error('Fant ikke starttidspunkt');
  let sec = 0, meters = 0, lapAvg = [], lapMax = 0;
  for (const lap of act.getElementsByTagName('Lap')) {
    sec += +txt(lap, 'TotalTimeSeconds') || 0; meters += +txt(lap, 'DistanceMeters') || 0;
    const av = lap.getElementsByTagName('AverageHeartRateBpm')[0], mx = lap.getElementsByTagName('MaximumHeartRateBpm')[0];
    if (av) lapAvg.push(+txt(av, 'Value')); if (mx) lapMax = Math.max(lapMax, +txt(mx, 'Value') || 0);
  }
  const samples = [];
  for (const tp of act.getElementsByTagName('Trackpoint')) {
    const t = Date.parse(txt(tp, 'Time')), hrEl = tp.getElementsByTagName('HeartRateBpm')[0];
    if (isNaN(t) || !hrEl) continue;
    const s = Math.round((t - start) / 1000), b = +txt(hrEl, 'Value');
    if (b && (!samples.length || s - samples[samples.length - 1][0] >= HR_STEP)) samples.push([s, b]);
  }
  return { sport: act.getAttribute('Sport') || 'Other', id: idTxt, start, sec, km: meters / 1000, samples,
    lapAvg: lapAvg.length ? Math.round(lapAvg.reduce((a, b) => a + b, 0) / lapAvg.length) : null, lapMax: lapMax || null };
}
function importTcx(text) {
  const p = prof(), r = parseTcx(text), source = 'tcx:' + r.id;
  if (p.workouts.some(w => w.source === source)) { flash('Denne økta er allerede importert'); return null; }
  const run = r.sport === 'Running';
  const name = run ? 'Løpetur' : r.sport === 'Biking' ? 'Sykkeltur' : 'Kondisjonsøkt';
  const wo = { id: uid(), date: r.start, end: r.start + r.sec * 1000, programId: null, dayIdx: null, name, notes: 'Importert fra Garmin', source,
    exercises: [{ exId: run ? 'run_outdoor' : 'cardio_other', sets: [{ w: Math.round(r.sec / 6) / 10, r: Math.round(r.km * 100) / 100, warm: false, done: true }] }],
    hr: hrSummary(r.samples, hrMax()) || (r.lapAvg ? { avg: r.lapAvg, max: r.lapMax || r.lapAvg, zones: null, samples: [] } : null) };
  p.workouts.push(wo); p.workouts.sort((x, y) => x.date - y.date); saveNow();
  return wo;
}

// xfmt = 'time' gir klokkeslett på x-aksen (pulsgraf), ellers dato
function lineChart(pts, unit, xfmt) {
  if (pts.length < 2) return `<div class="muted small">Trenger minst to økter for å vise graf.</div>`;
  const xl = v => xfmt === 'time' ? new Date(v).toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' }) : new Date(v).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
  const dots = xfmt !== 'time';
  const W = 640, H = 200, pl = 40, pr = 10, pt = 12, pb = 24;
  const ys = pts.map(p => p.y), min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
  const x = i => pl + (i / (pts.length - 1)) * (W - pl - pr), y = v => pt + (1 - (v - min) / span) * (H - pt - pb);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Utvikling">
    <line x1="${pl}" x2="${W - pr}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)"/><line x1="${pl}" x2="${W - pr}" y1="${y(min)}" y2="${y(min)}" stroke="var(--line)"/>
    <text x="${pl - 6}" y="${y(max) + 4}" text-anchor="end">${fmt(max)}</text><text x="${pl - 6}" y="${y(min) + 4}" text-anchor="end">${fmt(min)}</text>
    <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots ? pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="3.5" fill="var(--acc)"/>`).join('') : ''}
    <text x="${pl}" y="${H - 6}">${xl(pts[0].x)}</text>
    <text x="${W - pr}" y="${H - 6}" text-anchor="end">${xl(pts[pts.length - 1].x)}</text></svg>
    <div class="muted tiny">${unit}</div>`;
}
function viewProgress() {

  const zonesWeek = thisWeek.reduce((acc, w) => { (w.hr?.zones || []).forEach((v, z) => acc[z] += v); return acc; }, [0, 0, 0, 0, 0, 0]);

    ${paceRuns.length >= 2 ? `<div class="muted small" style="margin:12px 0 4px">Tempo per tur (lavere er raskere)</div>${lineChart(paceRuns, 'min/km')}` : ''}
    ${paceRuns.length ? `<div class="muted small" style="margin-top:6px">Sist: ${fmtDur(paceRuns[paceRuns.length - 1].y * 60)} /km over ${fmt(paceRuns[paceRuns.length - 1].km)} km</div>` : ''}</div>`;

function viewExercise({ exId }) {

    <button class="btn acc big" style="margin-top:14px" data-act="saveCustomEx">Lagre</button>`;
}

/* ---------- Handlinger ---------- */
const P = () => prof();
const progById = id => P().programs.find(x => x.id === id);
const ACT = {
  tab: d => go(d.t),
  back: () => back(),
  closeSheet: () => closeSheet(),
  dlgOk: () => { const o = state.dialog; if (!o) return; const v = o.input ? $('#dlgIn')?.value ?? '' : true; closeSheet(); o.onOk(v); },
  dlgCancel: () => closeSheet(),
  // Trening
  startDay: d => startWorkout(progById(d.pid), +d.d),
  startEmpty: () => startWorkout(null, null),
  pickDay: d => { P().progState[d.pid] = +d.d; save(); render(); },
  openWorkout: d => push({ type: 'workout', wid: d.wid }),
  // Økt
  setDone: d => {
    const a = P().active, e = a.exercises[+d.ei], s = e.sets[+d.si];
    const kind = implOf(EX(e.exId)).kind, type = EX(e.exId).type;
    const focus = f => { const inp = document.querySelector(`input[data-set][data-ei="${d.ei}"][data-si="${d.si}"][data-f="${f}"]`); inp?.focus(); inp?.select?.(); };
    if (!s.done && num(s.w) == null && type === 'reps' && kind !== 'added') { flash('Skriv inn vekt først'); focus('w'); return; }
    // Forslaget i feltet er et mål, ikke et resultat: reps må skrives inn før settet kan hukes av
    if (!s.done && type !== 'cardio' && num(s.r) == null) { flash(type === 'time' ? 'Skriv inn sekunder først' : 'Skriv inn reps først'); focus('r'); return; }
    s.done = !s.done;
    if (s.done) {
      if (type === 'cardio' && s.w === '' && s.tr) s.w = s.tr;
      if (s.w === '' && kind === 'added') s.w = '0';
      const ex = EX(e.exId);
      const grp = e.pe.ss ? a.exercises.map((y, i) => y.pe.ss === e.pe.ss ? i : -1).filter(i => i >= 0) : [];
      const pos = grp.indexOf(+d.ei);
      if (!s.warm && grp.length > 1 && pos < grp.length - 1) {
        const nx = grp[pos + 1];
        a.restEnd = null; save(); render();
        flash('Supersett → ' + EX(a.exercises[nx].exId).name);
        document.getElementById('ex-' + nx)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if (ex.type !== 'cardio') startRest(s.warm ? 60 : (e.pe.rest || db.settings.rest));
      if (!s.warm && grp.length > 1 && e.sets.some(z => !z.done && !z.warm)) {
        save(); render();
        setTimeout(() => document.getElementById('ex-' + grp[0])?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
        return;
      }
    }
    save(); render();
  },
  addSet: d => { const e = P().active.exercises[+d.ei], l = e.sets.filter(s => !s.warm).pop() || e.sets[e.sets.length - 1]; e.sets.push({ w: l?.w ?? '', r: '', tr: l?.tr || '', done: false, warm: false }); save(); render(); },
  setMenu: d => {
    const s = P().active.exercises[+d.ei].sets[+d.si];
    sheet(`<h3>Sett</h3>
      <div class="muted small" style="margin-bottom:6px">Reps igjen i tanken (RIR)</div><div class="row wrap" style="margin-bottom:12px">${[0, 1, 2, 3, 4].map(v => `<button class="chip ${s.rir === v ? 'on' : ''}" data-act="setRir" data-ei="${d.ei}" data-si="${d.si}" data-v="${v}">${v === 4 ? '4+' : v}</button>`).join('')}</div>
      <div class="list"><button class="li" data-act="toggleWarm" data-ei="${d.ei}" data-si="${d.si}">${s.warm ? 'Gjør til arbeidssett' : 'Marker som oppvarming'}</button>
      <button class="li" data-act="delSet" data-ei="${d.ei}" data-si="${d.si}" style="color:var(--bad)">Slett sett</button></div>`);
  },
  cueToggle: (d, el) => el.classList.toggle('clamp'),
  setRir: d => { const s = P().active.exercises[+d.ei].sets[+d.si]; s.rir = s.rir === +d.v ? null : +d.v; closeSheet(); save(); render(); },
  toggleWarm: d => { const s = P().active.exercises[+d.ei].sets[+d.si]; s.warm = !s.warm; closeSheet(); save(); render(); },
  delSet: d => { P().active.exercises[+d.ei].sets.splice(+d.si, 1); closeSheet(); save(); render(); },
  warmup: d => {
    const e = P().active.exercises[+d.ei], ex = EX(e.exId), impl = implOf(ex);
    const W = num(e.sets.find(s => !s.warm)?.w);
    if (!W) { flash('Skriv inn arbeidsvekt først'); return; }
    e.sets = e.sets.filter(s => !s.warm || s.done);
    const ws = warmupSets(impl, W).map(x => ({ w: fmtIn(x.w), r: '', tr: String(x.r), done: false, warm: true }));
    const firstWork = e.sets.findIndex(s => !s.warm);
    e.sets.splice(firstWork < 0 ? 0 : firstWork, 0, ...ws);
    save(); render(); if (!ws.length) flash('Vekta er for lett til egne oppvarmingssett');
  },
  exMenu: d => {
    const a = P().active, e = a.exercises[+d.ei];
    sheet(`<h3>${esc(EX(e.exId).name)}</h3><div class="list">
      <button class="li" data-act="swapEx" data-ei="${d.ei}">Bytt øvelse</button>
      <button class="li" data-act="editRest" data-ei="${d.ei}">Endre hviletid (${fmtDur(e.pe.rest || db.settings.rest)})</button>
      <button class="li" data-act="openExercise" data-ex="${e.exId}">ⓘ Om øvelsen og historikk</button>
      ${+d.ei > 0 ? `<button class="li" data-act="moveEx" data-ei="${d.ei}" data-dir="-1">↑ Flytt opp</button>` : ""}
      ${+d.ei < a.exercises.length - 1 ? `<button class="li" data-act="moveEx" data-ei="${d.ei}" data-dir="1">↓ Flytt ned</button>` : ""}
      <button class="li" data-act="removeEx" data-ei="${d.ei}" style="color:var(--bad)">${icon("trash", 20)} Fjern fra økta</button></div>`);
  },
  editRest: d => { const e = P().active.exercises[+d.ei]; ask({ title: 'Hviletid i sekunder', input: { value: e.pe.rest || db.settings.rest, numeric: true }, ok: 'Lagre', onOk: v => { if (num(v) > 0) { e.pe.rest = num(v); save(); } render(); } }); },
  swapEx: d => openPicker('swap', { ei: +d.ei }),
  moveEx: d => { P().active.iv = null; const l = P().active.exercises, i = +d.ei, j = i + +d.dir; if (j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; closeSheet(); save(); render(); },
  removeEx: d => ask({ title: 'Fjerne øvelsen fra økta?', text: EX(P().active.exercises[+d.ei].exId).name, ok: 'Fjern', danger: true, onOk: () => { P().active.iv = null; P().active.exercises.splice(+d.ei, 1); save(); render(); } }),
  addEx: () => openPicker('add', {}),
  pickEx: d => {
    const pk = state.picker, p = P(); if (!pk) return;
    const base = { sets: 3, min: 8, max: 12, rule: 'double', rest: db.settings.rest, inc: null };
    if (pk.mode === 'add') p.active.exercises.push(buildEntry(p, d.id, { exId: d.id, ...base }));
    if (pk.mode === 'swap') { const old = p.active.exercises[pk.ctx.ei]; p.active.exercises[pk.ctx.ei] = buildEntry(p, d.id, { ...old.pe, exId: d.id, inc: null, note: '', plan: null }); }
    if (pk.mode === 'prog') progById(pk.ctx.pid).days[pk.ctx.d].ex.push(pe(d.id, base.sets, base.min, base.max, 'double', base.rest));
    if (pk.mode === 'progSwap') { const x = progById(pk.ctx.pid).days[pk.ctx.d].ex[pk.ctx.i]; x.exId = d.id; x.inc = null; x.note = ''; x.plan = null; }
    closeSheet(); save(); render();
  },
  woMenu: () => sheet(`<h3>Økt</h3><div class="list"><button class="li" data-act="renameWo">Gi økta nytt navn</button><button class="li" data-act="cancelWo" style="color:var(--bad)">${icon("trash", 20)} Avbryt og forkast økta</button></div>`),
  renameWo: () => { const a = P().active; ask({ title: 'Navn på økta', input: { value: a.name }, ok: 'Lagre', onOk: v => { if (v.trim()) { a.name = v.trim(); save(); } render(); } }); },
  cancelWo: () => ask({ title: 'Forkaste hele økta?', text: 'Det som er logget blir ikke lagret.', ok: 'Forkast', danger: true, onOk: () => { P().active = null; releaseWake(); save(); render(); } }),
  finish: () => {
    const p = P(), a = p.active;
    // Bare det som trengs i historikken lagres (ikke programoppsettet), så localStorage ikke fylles opp
    const exs = a.exercises.map(e => ({ exId: e.exId, sets: e.sets.filter(s => s.done).map(s => ({ w: num(s.w), r: num(s.r), warm: !!s.warm, done: true, ...(s.rir != null ? { rir: s.rir } : {}) })) })).filter(e => e.sets.length);
    if (!exs.length) return ask({ title: 'Ingen sett er huket av', text: 'Forkaste økta?', ok: 'Forkast', danger: true, onOk: () => { p.active = null; releaseWake(); save(); render(); } });
    const undone = a.exercises.reduce((n, e) => n + e.sets.filter(s => !s.done && !s.warm).length, 0);
    if (undone) return ask({ title: `${undone} sett er ikke huket av`, text: 'De blir ikke lagret. Fullføre likevel?', ok: 'Fullfør', onOk: () => ACT.finishSave(exs) });
    ACT.finishSave(exs);
  },
  // Lagrer økta (kalles fra finish, aldri direkte fra et trykk)
  finishSave: exs => {
    if (!Array.isArray(exs)) return;
    const p = P(), a = p.active;
    const wo = { id: a.id, date: a.start, end: Date.now(), programId: a.programId, dayIdx: a.dayIdx, name: a.name, notes: a.notes || '', exercises: exs };
    const hrS = hrSummary(a.hrs, hrMax()); if (hrS) wo.hr = hrS;
    const prs = computePRs(p, wo);
    p.workouts.push(wo); p.workouts.sort((x, y) => x.date - y.date);
    const prog = a.programId && progById(a.programId);
    if (prog && a.dayIdx != null && prog.days.length) p.progState[prog.id] = (a.dayIdx + 1) % prog.days.length;
    p.active = null; releaseWake(); saveNow(); state.tab = 'train'; state.stack = []; render(); window.scrollTo(0, 0);
    const nSets = exs.reduce((n, e) => n + e.sets.filter(s => !s.warm).length, 0);
    sheet(`<h2 style="margin-top:0">Bra jobba! 💪</h2><div class="row" style="gap:8px"><div class="stat"><span class="muted small">Tid</span><b>${Math.round((wo.end - wo.date) / 60000)} min</b></div><div class="stat"><span class="muted small">Sett</span><b>${nSets}</b></div>${wo.hr ? `<div class="stat"><span class="muted small">Snittpuls</span><b>${wo.hr.avg}</b></div>` : `<div class="stat"><span class="muted small">Øvelser</span><b>${exs.length}</b></div>`}</div>
      ${prs.length ? `<h3 style="margin-top:16px">🏆 Nye rekorder</h3>${prs.map(x => `<div class="note up">${esc(x)}</div>`).join('')}` : ''}
      <button class="btn acc big" style="margin-top:14px" data-act="closeSheet">Lukk</button>`);
  },
  // Bytt til alternativ øvelse og husk valget i programmet
  altEx: d => {
    const p = P(), a = p.active, old = a.exercises[+d.ei];
    a.exercises[+d.ei] = buildEntry(p, d.id, { ...old.pe, exId: d.id, inc: null, note: '' });
    const pd = a.programId && progById(a.programId)?.days[a.dayIdx];
    const px = pd?.ex.find(x => x.exId === old.exId);
    if (px) { px.exId = d.id; px.note = ''; }
    save(); render(); flash(px ? EX(d.id).name + ' er valgt – huskes til neste gang' : 'Byttet til ' + EX(d.id).name);
  },
  ivZone: d => {
    const a = P().active, e = a.exercises[+d.ei];
    e.pe.plan.forEach(s => { if (s.alt) s.z = d.z; });
    const pd = a.programId && progById(a.programId)?.days[a.dayIdx];
    pd?.ex.forEach(x => (x.plan || []).forEach(s => { if (s.alt) s.z = d.z; }));
    save(); render();
  },
  // Endre varighet på en fase før start; huskes i programmet
  ivDur: d => {
    const a = P().active, e = a.exercises[+d.ei], i = +d.i, ph = e.pe.plan?.[i]; if (!ph) return;
    const m = d.m ? +d.m : Math.max(5, Math.round(ph.s / 60) + +d.d);
    ph.s = m * 60;
    const pd = a.programId && progById(a.programId)?.days[a.dayIdx];
    const px = pd?.ex.find(x => x.exId === e.exId && x.plan?.[i]?.t === ph.t); if (px) px.plan[i].s = m * 60;
    e.sets[0].tr = String(Math.round(planSec(e.pe.plan) / 60));
    save(); render();
  },
  ivStart: d => { const a = P().active; a.iv = { ei: +d.ei, start: Date.now(), pausedAt: null, pausedMs: 0, lastIdx: null }; a.restEnd = null; save(); render(); requestWake(); },
  ivPause: () => { const iv = P().active?.iv; if (!iv) return; if (iv.pausedAt) { iv.pausedMs += Date.now() - iv.pausedAt; iv.pausedAt = null; } else iv.pausedAt = Date.now(); save(); tick(); },
  ivSkip: () => { const a = P().active; if (!a?.iv) return; const st = ivState(a); a.iv.start -= st.left * 1000 + 10; save(); tick(); },
  ivStop: () => {
    const a = P().active; if (!a?.iv) return;
    ask({ title: 'Stoppe intervalltimeren?', ok: 'Stopp', danger: true, onOk: () => {
      const st = ivState(a), s = a.exercises[a.iv.ei]?.sets[0];
      if (s && st.el > 60) { s.w = String(Math.round(st.el / 60)); }
      a.iv = null; focusOff(); save(); render();
    } });
  },
  focusOn: () => { state.focus = true; try { window.history.pushState({ gg: 'focus' }, ''); } catch {} requestWake(); tick(); },
  focusOff: () => focusOff(),
  timerAdd: d => { const a = P().active; if (a?.restEnd) { a.restEnd += +d.s * 1000; a.restTotal = Math.max(1, (a.restTotal || 0) + +d.s); save(); tick(); } },
  timerStop: () => { const a = P().active; if (a) { a.restEnd = null; save(); } readyUntil = 0; tick(); },
  // Program
  hrMenu: () => {
    if (!hrSupported()) return sheet(`<h3>Pulsmåler</h3><p>Denne nettleseren kan ikke koble til Bluetooth-pulsmålere.</p>
      <p class="muted small">Det virker i Chrome på Android. Apple tillater ikke Bluetooth fra nettapper i Safari på iPhone. Løpeturer fra klokka kan likevel importeres med «Importer fra Garmin».</p>
      <button class="btn big" data-act="tcxHelp">Importer fra Garmin</button><h3 style="margin-top:18px">Pulssoner</h3>${zoneTable()}`);
    if (hrLive() || HR.status === 'kobler') return sheet(`<h3>Pulsmåler</h3><p>${HR.status === 'kobler' ? 'Kobler til …' : `Tilkoblet <b>${esc(HR.name)}</b> · ${HR.bpm} slag/min`}</p>
      <p class="muted small">Pulsen lagres sammen med økta. Snitt, maks og tid i hver sone vises når økta er fullført.</p>
      <button class="btn big danger" data-act="hrOff">Koble fra</button>`);
    sheet(`<h3>Koble til Garmin-klokka</h3>
      <ol class="how"><li>Start en aktivitet på klokka, f.eks. <b>Tredemølle</b> eller <b>Styrke</b>.</li>
        <li>Hold inne <b>OPP</b>-knappen, velg aktivitetsinnstillinger og slå på <b>Kringkast puls</b>.</li>
        <li>Trykk <b>Koble til</b> under og velg klokka i lista.</li></ol>
      <p class="muted small">Pulsmålere med Bluetooth, f.eks. Garmin HRM-Dual, virker også. Kringkasting bruker litt mer batteri på klokka.</p>
      <button class="btn acc big" data-act="hrOn">${icon('heart', 18)} Koble til</button><h3 style="margin-top:18px">Pulssoner</h3>${zoneTable()}`);
  },
  hrOn: () => { closeSheet(); hrConnect(); },
  hrOff: () => { closeSheet(); hrDisconnect(); flash('Pulsmåler frakoblet'); render(); },
  tcxHelp: () => sheet(`<h3>Importer økt fra Garmin</h3>
    <ol class="how"><li>Åpne <b>connect.garmin.com</b> i nettleseren (logg inn med Garmin-kontoen).</li>
      <li>Åpne aktiviteten, trykk på tannhjulet ⚙ og velg <b>Eksporter til TCX</b>.</li>
      <li>Trykk <b>Velg fil</b> under og velg filen fra Nedlastinger.</li></ol>
    <p class="muted small">Distanse, tid, tempo og puls hentes inn. Har du lagt inn makspuls under Mer, vises også tid i hver pulssone. Garmin Connect-appen på mobilen har ikke eksport, så bruk nettsiden. Velg «Datamaskinversjon» i nettleseren om nødvendig.</p>
    <button class="btn acc big" data-act="tcxPick">${icon('upload', 18)} Velg fil</button>`),
  tcxPick: () => $('#tcxFile').click(),
  toggleProgram: d => { const p = P(), on = p.activeIds.includes(d.pid); p.activeIds = on ? p.activeIds.filter(x => x !== d.pid) : p.activeIds.concat(d.pid); save(); render(); flash(on ? 'Skjult fra Trening' : 'Vises nå under Trening'); },
  progMenu: d => { const pr = progById(d.pid); sheet(`<h3>${esc(pr.name)}</h3><div class="list">
      ${d.inedit ? '' : `<button class="li" data-act="editProgram" data-pid="${d.pid}">Rediger</button>`}
      <button class="li" data-act="dupProgram" data-pid="${d.pid}">Lag en kopi</button>
      <button class="li" data-act="delProgram" data-pid="${d.pid}" style="color:var(--bad)">${icon('trash', 20)} Slett program</button></div>`); },
  newProgramMenu: () => sheet(`<h3>Nytt program</h3><div class="list">
      <button class="li" data-act="addTemplates"><div class="grow"><b>Fra biblioteket</b><div class="muted small">Ferdige program tilpasset utstyret deres</div></div><span class="chev">›</span></button>
      <button class="li" data-act="newProgram"><div class="grow"><b>Tomt program</b><div class="muted small">Bygg ditt eget fra bunnen</div></div><span class="chev">›</span></button></div>`),
  dayMenu: d => { const pr = progById(d.pid); sheet(`<h3>${esc(pr.days[+d.d].name)}</h3><div class="list">
      ${+d.d > 0 ? `<button class="li" data-act="moveDay" data-pid="${d.pid}" data-d="${d.d}" data-dir="-1">↑ Flytt opp</button>` : ''}
      ${+d.d < pr.days.length - 1 ? `<button class="li" data-act="moveDay" data-pid="${d.pid}" data-d="${d.d}" data-dir="1">↓ Flytt ned</button>` : ''}
      <button class="li" data-act="delDay" data-pid="${d.pid}" data-d="${d.d}" style="color:var(--bad)">${icon('trash', 20)} Slett dag</button></div>`); },
  peToggle: d => { state.peOpen = state.peOpen === d.k ? null : d.k; render(); },
  toggleSetting: d => { db.settings[d.f] = !db.settings[d.f]; save(); render(); },
  useProgram: d => { const p = P(); if (!p.activeIds.includes(d.pid)) p.activeIds.push(d.pid); save(); flash('Programmet vises nå på Trening'); render(); },
  unuseProgram: d => { const p = P(); p.activeIds = p.activeIds.filter(x => x !== d.pid); save(); render(); },
  editProgram: d => { closeSheet(); push({ type: 'program', pid: d.pid }); },
  newProgram: () => { closeSheet(); const pr = { id: uid(), name: 'Mitt program', note: '', days: [day('Dag 1', [])] }; P().programs.push(pr); save(); push({ type: 'program', pid: pr.id }); },
  dupProgram: d => { closeSheet(); const pr = clone(progById(d.pid)); pr.id = uid(); pr.name += ' (kopi)'; pr.days.forEach(x => x.id = uid()); P().programs.push(pr); save(); render(); },
  addTemplates: () => sheet(`<h3>Programbibliotek</h3><div class="list">${TEMPLATES().map((t, i) => `<button class="li" data-act="addTemplate" data-i="${i}"><div class="grow"><div><b>${esc(t.name)}</b></div><div class="muted small">${t.days.length} dager · ${esc(t.note || '')}</div></div><span class="chip">Legg til</span></button>`).join('')}</div>`),
  addTemplate: d => { const t = TEMPLATES()[+d.i], p = P(); p.programs.push(t); p.activeIds.push(t.id); save(); closeSheet(); flash('«' + t.name + '» er lagt til og aktivert'); render(); },
  delProgram: d => ask({ title: `Slette «${progById(d.pid)?.name}»?`, text: 'Loggførte økter beholdes.', ok: 'Slett', danger: true, onOk: () => { const p = P(); p.programs = p.programs.filter(x => x.id !== d.pid); p.activeIds = p.activeIds.filter(x => x !== d.pid); save(); back(); } }),
  addDay: d => { const pr = progById(d.pid); pr.days.push(day('Dag ' + (pr.days.length + 1), [])); save(); render(); },
  delDay: d => ask({ title: 'Slette dagen?', text: 'Øvelsene i dagen fjernes fra programmet.', ok: 'Slett', danger: true, onOk: () => { state.peOpen = null; progById(d.pid).days.splice(+d.d, 1); P().progState[d.pid] = 0; save(); render(); } }),
  moveDay: d => { closeSheet(); state.peOpen = null; const l = progById(d.pid).days, i = +d.d, j = i + +d.dir; if (j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; save(); render(); },
  addPe: d => openPicker('prog', { pid: d.pid, d: +d.d }),
  progSwap: d => openPicker('progSwap', { pid: d.pid, d: +d.d, i: +d.i }),
  movePe: d => { const l = progById(d.pid).days[+d.d].ex, i = +d.i, j = i + +d.dir; if (j >= 0 && j < l.length) state.peOpen = `${d.pid}:${d.d}:${j}`; if (j >= 0 && j < l.length) [l[i], l[j]] = [l[j], l[i]]; save(); render(); },
  // Intervallplan i programredigering (jobber på blokker, lagrer flatt)
  planAdd: d => { const x = progById(d.pid).days[+d.d].ex[+d.i], bl = L.planToBlocks(x.plan || []);
    bl.push(d.kind === 'rep' ? { n: 4, segs: [{ t: 'Drag', s: 240, z: '4' }, { t: 'Pause', s: 180, z: '2' }] } : { n: 1, segs: [{ t: 'Fase', s: 300, z: '2' }] });
    x.plan = L.blocksToPlan(bl); save(); render(); },
  planAddSeg: d => { const x = progById(d.pid).days[+d.d].ex[+d.i], bl = L.planToBlocks(x.plan || []); bl[+d.b]?.segs.push({ t: 'Fase', s: 60, z: '2' }); x.plan = L.blocksToPlan(bl); save(); render(); },
  planDelSeg: d => { const x = progById(d.pid).days[+d.d].ex[+d.i], bl = L.planToBlocks(x.plan || []); bl[+d.b]?.segs.splice(+d.s, 1); x.plan = L.blocksToPlan(bl.filter(b => b.segs.length)); save(); render(); },
  planMove: d => { const x = progById(d.pid).days[+d.d].ex[+d.i], bl = L.planToBlocks(x.plan || []), i = +d.b, j = i + +d.dir; if (j < 0 || j >= bl.length) return; [bl[i], bl[j]] = [bl[j], bl[i]]; x.plan = L.blocksToPlan(bl); save(); render(); },
  delPe: d => { state.peOpen = null; progById(d.pid).days[+d.d].ex.splice(+d.i, 1); save(); render(); },
  // Fremgang
  openExercise: d => { closeSheet(); push({ type: 'exercise', exId: d.ex }); },
  delWorkout: d => ask({ title: 'Slette økta permanent?', ok: 'Slett', danger: true, onOk: () => { const p = P(); p.workouts = p.workouts.filter(w => w.id !== d.wid); save(); back(); } }),
  delWoSet: d => {
    const w = P().workouts.find(x => x.id === d.wid), e = w?.exercises[+d.ei]; if (!e) return;
    e.sets.splice(+d.si, 1);
    if (!e.sets.length) w.exercises.splice(+d.ei, 1);
    save(); render();
  },
  addBw: () => { const v = num($('#bwIn').value); if (!v) return; P().bw.push({ date: Date.now(), kg: v }); save(); render(); flash('Kroppsvekt lagret'); },
  delBw: d => { const p = P(); p.bw = p.bw.filter(b => b.date !== +d.t); save(); render(); },
  // Mer
  switchProfile: d => { if (P().active && d.id !== db.current) flash('Økta til ' + P().name + ' er lagret og venter'); db.current = d.id; save(); go('train'); },
  addProfile: () => ask({ title: 'Ny profil på denne telefonen', input: { placeholder: 'Navn' }, ok: 'Opprett', onOk: n => { n = n.trim(); if (!n) return; const p = newProfile(n); db.profiles[p.id] = p; db.current = p.id; save(); go('train'); } }),
  openPlates: () => push({ type: 'plates' }),
  openLibrary: () => go('library'),
  libM: d => { state.libM = d.m; render(); },
  heatWeek: d => { state.heatWeek = +d.w; render(); },
  musInfo: d => { const n = state.heatMus?.[d.m] || 0; flash(`${MUS[d.m]}: ${fmt(n)} sett ${state.heatWeek ? 'forrige uke' : 'denne uka'}`); },
  setPlateW: d => { state.plateW = fmtIn(+d.w); render(); },
  openEquipment: () => push({ type: 'equipment' }),
  openCustomEx: () => push({ type: 'customEx' }),
  newCustomEx: () => { const pk = state.picker; sheet(customExForm()); state.picker = pk; },
  saveCustomEx: () => {
    const name = $('#ceName').value.trim(); if (!name) { flash('Skriv inn et navn'); return; }
    const ex = E('c_' + uid(), name, $('#ceImpl').value, $('#cePat').value, [$('#ceMus').value], [], { type: $('#ceType').value });
    (db.settings.customEx = db.settings.customEx || []).push(ex); exMap = null; save();
    if (state.picker) { ACT.pickEx({ id: ex.id }); return; }
    closeSheet(); render();
  },
  delCustomEx: d => ask({ title: 'Slette øvelsen?', text: 'Historikken beholdes, men vises som ukjent øvelse.', ok: 'Slett', danger: true, onOk: () => { db.settings.customEx = db.settings.customEx.filter(e => e.id !== d.id); exMap = null; save(); render(); } }),
  export: async () => {
    saveNow();
    const name = `garasjegym-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([JSON.stringify(db)], name, { type: 'application/json' });
    const done = () => { db.lastExport = Date.now(); save(); render(); };
    if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Garasjegym backup' }); done(); return; } catch (e) { if (e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); done();
  },
  import: () => $('#importFile').click(),
};
const CHANGE = {
  woNotes: (d, el) => { P().active.notes = el.value; save(); },
  woNotesDone: (d, el) => { const w = P().workouts.find(x => x.id === d.wid); if (w) { w.notes = el.value; save(); } },
  woSet: (d, el) => { const s = P().workouts.find(x => x.id === d.wid)?.exercises[+d.ei]?.sets[+d.si]; if (!s) return; s[d.f] = num(el.value); el.value = fmtIn(s[d.f]); save(); },
  progField: (d, el) => { progById(d.pid)[d.f] = el.value; save(); },
  dayName: (d, el) => { progById(d.pid).days[+d.d].name = el.value || 'Dag'; save(); },
  planField: (d, el) => {
    const x = progById(d.pid).days[+d.d].ex[+d.i], bl = L.planToBlocks(x.plan || []), b = bl[+d.b], seg = b?.segs[+d.s]; if (!b) return;
    if (d.f === 'n') b.n = Math.max(1, Math.min(30, Math.round(num(el.value) || 1)));
    else if (seg && d.f === 't') seg.t = el.value.trim().replace(/ \d+\/\d+$/, '') || 'Fase';
    else if (seg && d.f === 'm') seg.s = Math.max(1, Math.round(num(el.value) || 1)) * 60;
    else if (seg && d.f === 'z') { seg.z = el.value; delete seg.alt; }
    x.plan = L.blocksToPlan(bl); save(); render();
  },
  peField: (d, el) => {
    const x = progById(d.pid).days[+d.d].ex[+d.i];
    if (d.f === 'rule' || d.f === 'ss' || d.f === 'note') x[d.f] = el.value;
    else if (d.f === 'inc') x.inc = num(el.value);
    else { const v = Math.max(d.f === 'rest' ? 0 : 1, Math.round(num(el.value) || 0)); x[d.f] = v; if (d.f === 'min' && x.max < v) x.max = v; if (d.f === 'max' && x.min > v) x.min = v; }
    save(); render();
  },
  profName: (d, el) => { P().name = el.value.trim() || 'Meg'; save(); },
  hrMax: (d, el) => { const v = Math.round(num(el.value) || 0); P().hrMax = v >= 120 && v <= 230 ? v : null; save(); render(); },
  birthYear: (d, el) => { const v = Math.round(num(el.value) || 0), y = new Date().getFullYear(); P().birthYear = v >= y - 100 && v <= y - 5 ? v : null; save(); render(); },
  setting: (d, el) => { const s = db.settings; s[d.f] = d.f === 'rest' ? (num(el.value) || 120) : d.f === 'theme' ? el.value : el.value === '1'; save(); render(); },
  plateImpl: (d, el) => { state.plateImpl = el.value; render(); },
  plateW: (d, el) => { state.plateW = el.value; render(); },
  plateCount: (d, el) => { db.settings.plates[String(+d.p)] = Math.max(0, Math.round(num(el.value) || 0)); clearPlateCache(); save(); render(); },
  implField: (d, el) => { const i = db.settings.impl[d.k]; i[d.f] = d.f === 'list' ? el.value : num(el.value) ?? 0; if (d.f === 'sides') i.sides = +el.value; clearPlateCache(); save(); render(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  ensureAudio();
  ACT[el.dataset.act]?.(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.set) {
    const ei = +el.dataset.ei, si = +el.dataset.si, e = P().active.exercises[ei], s = e.sets[si];
    const prev = s[el.dataset.f];
    s[el.dataset.f] = el.value;
    if (el.dataset.f === 'w') {
      const impl = implOf(EX(e.exId));
      // Fyll samme vekt inn i senere arbeidssett som var tomme eller hadde samme verdi
      e.sets.forEach((z, j) => {
        if (j < si || (j !== si && (z.done || z.warm !== s.warm || (z.w !== '' && z.w !== prev)))) return;
        if (j !== si) { z.w = el.value; const inp = document.querySelector(`input[data-set][data-ei="${ei}"][data-si="${j}"][data-f="w"]`); if (inp) inp.value = el.value; }
        const pl = document.getElementById(`pl-${ei}-${j}`); if (pl) pl.textContent = setSub(impl, e.sets[j]);
      });
    }
    const pc = document.getElementById(`pace-${ei}`); if (pc) pc.textContent = paceLine(s);
    save();
  } else if (el.dataset.filter) {
    const q = el.value.toLowerCase().trim();
    if (el.dataset.filter === 'app') state.libQ = el.value;
    document.querySelectorAll(el.dataset.filter === 'app' ? '#app .pick' : '#sheetBody .pick').forEach(b => b.hidden = q && !b.dataset.n.includes(q));
    document.querySelectorAll('#sheetBody .pickhead').forEach(h => h.style.display = q ? 'none' : '');
  }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change) CHANGE[el.dataset.change]?.(el.dataset, el); });
$('#tcxFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const wo = importTcx(await f.text());
    if (!wo) return;
    closeSheet(); state.tab = 'progress'; state.stack = []; push({ type: 'workout', wid: wo.id }); flash(wo.name + ' importert');
  } catch (err) { info('Kunne ikke importere', err.message); }
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const bad = validateDb(data); if (bad) throw new Error(bad);
    const n = Object.values(data.profiles).reduce((a, p) => a + p.workouts.length, 0);
    ask({ title: 'Erstatte alt på denne telefonen?', text: `Filen inneholder ${Object.keys(data.profiles).length} profil(er) og ${n} økter. Det som ligger her nå blir overskrevet.`, ok: 'Importer', danger: true, onOk: () => {
      // Det som lå her fra før beholdes til filen er lest inn uten feil
      const prev = localStorage.getItem(KEY);
      try { localStorage.setItem(KEY, JSON.stringify(data)); load(); }
      catch (err) { if (prev != null) localStorage.setItem(KEY, prev); load(); info('Kunne ikke importere', 'Filen lot seg ikke lese inn, det gamle innholdet er beholdt. (' + err.message + ')'); return; }
      clearPlateCache(); go('train'); flash('Importert');
    } });
  } catch (err) { info('Kunne ikke importere', err.message); }
});

/* ---------- Dra bunnarket ned for å lukke ---------- */
// Fra håndtaket alltid; fra innholdet bare når lista er scrollet helt til toppen.
(() => {
  const pane = $('#sheet .pane');
  let y0 = null, dy = 0, drag = false;
  pane.addEventListener('touchstart', e => {
    const fromGrab = !!e.target.closest('.grabzone');
    if (fromGrab || pane.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; drag = fromGrab; } else y0 = null;
  }, { passive: true });
  pane.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (!drag) { if (dy < 0 || pane.scrollTop > 0) { y0 = null; return; } if (dy < 8) return; drag = true; }
    e.preventDefault();
    pane.style.transition = 'none';
    pane.style.transform = `translateY(${Math.max(0, dy)}px)`;
  }, { passive: false });
  pane.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null;
    if (!drag) return;
    drag = false;
    pane.style.transition = 'transform .2s ease-out';
    if (dy > 90) { pane.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 190); }
    else pane.style.transform = '';
  });
  $('#sheet .bd').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
})();

/* ---------- Oppstart ---------- */
// Inngang for feilsøking og automatiske tester (modulen har ellers ingen globale variabler)
window.GG = { get db() { return db; }, state, prof, load, save, saveNow, render, L };
load();
render();
requestWake();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // Se etter ny versjon hver gang appen hentes fram igjen
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  // Ny versjon er installert: last på nytt med en gang hvis ingen økt pågår, ellers ved neste anledning
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type !== 'updated') return;
    if (!prof()?.active) { saveNow(); location.reload(); } else flash('Ny versjon er klar – lastes når økta er ferdig');
  });
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (db.settings.theme === 'auto') render(); });
